name: Release

# Automatic semantic versioning from Angular-convention commit messages.
#
# How it works: every push to main, release-please reads the commits since the last tag
# and maintains a single open PR titled "chore(main): release X.Y.Z". That PR carries the
# version bump (package.json + both version fields in server.json) and the generated
# CHANGELOG entry. Nothing publishes while it sits there.
#
# Merging that PR is the release. release-please then tags, creates the GitHub Release,
# and this workflow calls publish.yml — which runs the full CI suite and the tarball audit
# before anything reaches npm.
#
# Why call publish.yml rather than let it fire on `release: published`: GitHub deliberately
# does not trigger workflows from events raised by GITHUB_TOKEN, to stop workflows looping.
# The usual workaround is a personal access token; calling the workflow directly avoids
# holding a PAT in this repo at all.
#
# Version bumps follow Angular convention:
#   fix:      -> patch     (2.0.0 -> 2.0.1)
#   feat:     -> minor     (2.0.0 -> 2.1.0)
#   feat!: / BREAKING CHANGE: in the footer -> major (2.0.0 -> 3.0.0)
#   docs/style/refactor/perf/test/build/ci/chore -> no release on their own

on:
  push:
    branches: [main]
  workflow_dispatch:

# A called workflow cannot request more than its caller was granted, so id-token has to be
# here even though only publish.yml and the registry job use it. Omitting it fails the run
# at startup, before any job is scheduled and before any log exists to explain why.
permissions:
  contents: write        # create tags, releases, and the release PR's commits
  pull-requests: write   # open and update the release PR
  issues: write          # labels — see below; PR labels go through the Issues API
  id-token: write        # npm provenance in publish.yml, OIDC in the registry job

# Why issues: write, when this workflow never touches an issue.
#
# release-please tracks its own state in PR LABELS, not in git. A release PR is
# opened as `autorelease: pending` and relabelled `autorelease: tagged` once its
# tag exists. GitHub applies labels to PRs through the Issues API, so the label
# write needs this scope — contents+pull-requests is enough to cut the release
# but not to record that it happened.
#
# The failure that produced this line: v2.2.0 and v2.3.0 were both tagged and
# released correctly, but their PRs stayed `autorelease: pending`, and the
# `autorelease: tagged` label did not exist in this repo at all. On every later
# run release-please then found "untagged, merged release PRs outstanding" and
# aborted before opening a new PR — silently, with a green check. 23 commits
# accumulated unreleased across three weeks before anyone noticed.

# Never run two of these at once — concurrent runs fight over the same release PR.
# Do not cancel in progress: a half-created release is worse than a queued one.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      # A release cut by the fallback below must still publish. Without this the
      # downstream jobs gate on release_created alone, which is false exactly
      # when the fallback was needed — the release exists and nothing ships.
      unjam_created: ${{ steps.unjam.outputs.created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Self-heal the label handoff, because it demonstrably does not always happen.
      #
      # release-please records its state in PR labels: a release PR opens as
      # `autorelease: pending` and should be relabelled `autorelease: tagged` once
      # its tag exists. When that second write is missed, EVERY later run reports
      # "There are untagged, merged release PRs outstanding - aborting" and exits
      # 0 — green workflow, no releases, forever. It jammed here for three weeks
      # and 23 commits before anyone looked.
      #
      # Observed, not assumed: PR #10 and #11 released automatically (v2.1.0,
      # v2.2.0). #11's label was never flipped, and from that moment #12 and #13
      # both failed to release. One missed label write is unrecoverable without
      # manual intervention.
      #
      # So this does not merely detect the jam, it clears it: any merged release
      # PR still marked pending whose version IS already tagged gets relabelled
      # here. That is precisely the write release-please should have made, and it
      # is safe because the tag existing is proof the release completed. The
      # merge-to-tag window is excluded, so a legitimately in-flight release is
      # left alone.
      #
      # Runs even when the action failed, so a jam cannot hide behind a red step.
      - name: Unjam the release label handoff
        id: unjam
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          pending=$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged \
                      --label 'autorelease: pending' --limit 20 --json number --jq '.[].number')
          if [ -z "$pending" ]; then echo "No merged release PR is left pending."; exit 0; fi

          # Read the manifest over the API — this job never checks the repo out,
          # so there is no working tree to read it from.
          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/.release-please-manifest.json" \
                      --jq '.content' | base64 -d | jq -r '.["."]')
          echo "manifest version: ${version}"

          for n in $pending; do
            if gh release view "v${version}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::warning::PR #${n} was left 'autorelease: pending' although v${version} is tagged — relabelling so release-please is not jammed."
              gh pr edit "$n" --repo "$GITHUB_REPOSITORY" \
                --add-label 'autorelease: tagged' --remove-label 'autorelease: pending'
            else
              # release-please did not cut the release. This is not hypothetical:
              # it happened for v2.3.0, v2.4.0 and v2.4.1, and its log shows it
              # never even attempts the release phase — it goes straight to
              # building a PR, finds the merged one outstanding, and aborts. Each
              # of those was tagged by hand, which is not a pipeline.
              #
              # So the workflow owns the outcome instead of hoping. release-please
              # stays the preferred path; when it declines, this cuts exactly the
              # release it should have: the manifest version, on the merge commit
              # of the PR that bumped it, with that version's changelog section as
              # the notes. Then it labels it tagged, which is what unjams the next
              # run.
              echo "::warning::release-please did not cut v${version} for PR #${n} — creating it here."
              sha=$(gh pr view "$n" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')
              gh api "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md" --jq '.content' \
                | base64 -d > /tmp/CHANGELOG.md
              # This version's section only, up to the next H2. Matched as a
              # literal prefix rather than a regex: awk -v mangles the backslashes
              # in "## \[2.4.1\]" and the pattern silently matches nothing, which
              # would ship every release with empty notes.
              awk -v v="## [${version}]" '
                index($0,v)==1 {f=1; print; next} f && /^## \[/ {exit} f {print}
              ' /tmp/CHANGELOG.md > /tmp/notes.md
              [ -s /tmp/notes.md ] || echo "Release v${version}" > /tmp/notes.md
              gh release create "v${version}" --repo "$GITHUB_REPOSITORY" \
                --target "$sha" --title "v${version}" --notes-file /tmp/notes.md
              echo "Created v${version} at ${sha}."
              echo "created=true" >> "$GITHUB_OUTPUT"
              echo "tag=v${version}" >> "$GITHUB_OUTPUT"
              gh pr edit "$n" --repo "$GITHUB_REPOSITORY" \
                --add-label 'autorelease: tagged' --remove-label 'autorelease: pending'
            fi
          done

  # Only reached when the release PR was just merged. Reuses the publish pipeline
  # verbatim — same consistency check, same CI gate, same tarball audit, same provenance.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.unjam_created == 'true'
    uses: ./.github/workflows/publish.yml
    secrets: inherit

  registry:
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.unjam_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # The registry rejects a server.json whose version is not yet on npm, and npm's CDN
      # takes a moment to serve a fresh publish. Wait for it rather than racing.
      - name: Wait for npm to serve the new version
        run: |
          V="${{ needs.release-please.outputs.version }}"
          for i in $(seq 1 30); do
            npm view "bagos-mcp-server@$V" version >/dev/null 2>&1 && { echo "npm is serving $V"; exit 0; }
            echo "waiting for bagos-mcp-server@$V on npm ($i/30)"; sleep 10
          done
          echo "::error::npm did not serve $V within 5 minutes"; exit 1
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz"
          test -s /tmp/mcp-publisher.tar.gz
          tar xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          chmod +x /tmp/mcp-publisher
      - name: Publish to the MCP registry
        run: |
          /tmp/mcp-publisher validate
          /tmp/mcp-publisher login github-oidc
          /tmp/mcp-publisher publish
