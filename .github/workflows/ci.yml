name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref. A new push supersedes the in-flight run instead of queueing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Stage 1: Quality ────────────────────────────────────────
  # Lint and types. Cheapest signal, so it gates everything below.
  quality:
    name: Quality (lint + types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

  # ── Stage 2: Security ───────────────────────────────────────
  # Runs in parallel with Test — a dependency advisory does not depend on the suite.
  # CodeQL and gitleaks are separate workflows; this is the SCA layer.
  security:
    name: Security (npm audit)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A plain `--audit-level=high` gate can never pass here and is therefore not a gate.
      # Every high advisory in this tree is transitive through @bagsfm/bags-sdk and
      # @solana/web3.js, and `npm audit fix --force` "resolves" them by downgrading the SDK
      # to 1.0.8 — a version with no `trade` and no `partner` services, i.e. a build that
      # crashes on three of our tools — and web3.js to 0.0.3.
      #
      # So this is a ratchet instead: any CRITICAL fails, and any count rising above the
      # committed baseline fails. Upstream's existing debt does not block us; new debt does.
      # When upstream ships fixes, lower .audit-baseline.json.
      - name: Audit production dependencies (ratchet)
        run: |
          npm audit --omit=dev --json > /tmp/audit.json || true
          node -e '
            const now = require("/tmp/audit.json").metadata.vulnerabilities;
            const base = require("./.audit-baseline.json");
            const sev = ["critical", "high", "moderate", "low"];
            console.log("severity   baseline  current");
            for (const s of sev) {
              console.log("  " + s.padEnd(9) + String(base[s]).padStart(8) + String(now[s]).padStart(9));
            }
            if (now.critical > 0) {
              console.error("::error::" + now.critical + " CRITICAL advisories — these block regardless of baseline");
              process.exit(1);
            }
            const worse = sev.filter(s => now[s] > base[s]);
            if (worse.length) {
              console.error("::error::new vulnerabilities since the baseline: " +
                worse.map(s => `${s} ${base[s]}->${now[s]}`).join(", ") +
                ". Investigate, then either fix or update .audit-baseline.json with a reason.");
              process.exit(1);
            }
            const better = sev.filter(s => now[s] < base[s]);
            if (better.length) {
              console.log("::notice::upstream improved (" +
                better.map(s => `${s} ${base[s]}->${now[s]}`).join(", ") +
                ") — lower .audit-baseline.json to lock the gain in");
            }
            console.log("no new vulnerabilities since " + base._recorded);
          '

  # ── Stage 3: Test ───────────────────────────────────────────
  # Coverage is enforced at 100% by jest.config.ts, so a drop fails here.
  test:
    name: Test (coverage enforced)
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Tests with coverage
        run: npm run test:coverage

  # ── Stage 4: Build ──────────────────────────────────────────
  # Proves the published artifact compiles and the bin entrypoint is executable —
  # this is what `npx bagos-mcp-server` actually runs.
  build:
    name: Build (packaged artifact)
    runs-on: ubuntu-latest
    needs: [security, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile
        run: npm run build
      - name: Entrypoint is executable and starts
        run: |
          test -x build/index.js || { echo "build/index.js is not executable"; exit 1; }
          # There is no API key in CI, and that is now a [WARN] rather than a fatal:
          # the server starts and serves tools/list so clients can see what it offers
          # before being configured. It prints its config report either way.
          timeout 20s node build/index.js < /dev/null > startup.log 2>&1 || true
          cat startup.log
          grep -q "BagOS MCP server — configuration" startup.log
      # A stdio bundle is never executed by a registry, so manifest.json's `tools`
      # array is the only capability metadata a registry can read. It is generated
      # from the server, and stale-checked here: renaming a tool without
      # regenerating would silently ship a manifest describing a server that no
      # longer exists, which is how Smithery came to list this one with zero tools.
      - name: Manifest tool list matches the server
        run: node scripts/sync-manifest-tools.mjs --check
      - name: Pack check (what npm would publish)
        run: npm pack --dry-run
