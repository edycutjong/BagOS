name: Publish to npm

# Publishes the unscoped package to registry.npmjs.org with provenance.
#
# It must be npmjs: the official MCP registry accepts only
# https://registry.npmjs.org as an npm base URL, and GitHub Packages requires
# an auth token to install even when public — so `npx bagos-mcp-server` could
# never work for a stranger. This workflow previously targeted GitHub Packages
# under the @edycutjong scope; see CHANGELOG 2.0.0.

on:
  release:
    types: [published]
  workflow_dispatch:
  # Callable by release-please. A release created with GITHUB_TOKEN does NOT fire the
  # `release: published` trigger above — GitHub suppresses it to prevent workflows
  # recursively triggering each other. So release-please calls this directly instead of
  # relying on the event, which is also why there is no PAT anywhere in this repo.
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required for npm provenance
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # The registry verifies package.json's mcpName against the published
      # tarball, and rejects a server.json whose version is not a real published
      # version. A drift between these three is a failed submission, so catch it
      # here rather than after publishing an unusable version.
      - name: Verify version and mcpName consistency
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          MCP_NAME=$(node -p "require('./package.json').mcpName || ''")
          SRV_VERSION=$(node -p "require('./server.json').version")
          SRV_NAME=$(node -p "require('./server.json').name")
          SRV_IDENT=$(node -p "require('./server.json').packages[0].identifier")
          SRV_PKG_VERSION=$(node -p "require('./server.json').packages[0].version")

          fail=0
          [ "$PKG_VERSION" = "$SRV_VERSION" ]     || { echo "::error::package.json version ($PKG_VERSION) != server.json version ($SRV_VERSION)"; fail=1; }
          [ "$PKG_VERSION" = "$SRV_PKG_VERSION" ] || { echo "::error::package.json version ($PKG_VERSION) != server.json packages[0].version ($SRV_PKG_VERSION)"; fail=1; }
          [ "$PKG_NAME" = "$SRV_IDENT" ]          || { echo "::error::package.json name ($PKG_NAME) != server.json packages[0].identifier ($SRV_IDENT)"; fail=1; }
          [ "$MCP_NAME" = "$SRV_NAME" ]           || { echo "::error::package.json mcpName ($MCP_NAME) != server.json name ($SRV_NAME)"; fail=1; }
          [ -n "$MCP_NAME" ]                      || { echo "::error::package.json is missing mcpName; the MCP registry uses it to verify package ownership"; fail=1; }
          exit $fail

      # Fail before spending a CI run on a version npm will reject. npm's own error is
      # E403 and reads like an auth problem, which sends you looking in the wrong place.
      - name: Fail if this version is already published
        run: |
          V=$(node -p "require('./package.json').version")
          N=$(node -p "require('./package.json').name")
          if npm view "$N@$V" version >/dev/null 2>&1; then
            echo "::error::$N@$V is already on npm. Versions are immutable — bump package.json and server.json."
            exit 1
          fi
          echo "$N@$V is not yet published — proceeding."

      - name: Lint, typecheck, test
        run: npm run ci

      - name: Build
        run: npm run build

      # Audit the tarball BEFORE it is public. npm effectively does not allow unpublish,
      # so anything wrong here is wrong forever — the remedy is a fast-follow version, not
      # a fix. Added after 2.0.0 shipped without this check; the retroactive audit came
      # back clean, which was luck rather than process.
      - name: Audit the tarball
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const p = require("/tmp/pack.json")[0];
            const files = p.files.map(f => f.path);
            console.log("packed " + files.length + " files:");
            for (const f of files) console.log("  " + f);

            // Allowlist by prefix. A new top-level entry fails here on purpose — extend
            // this list deliberately rather than discovering the leak on npm.
            const ok = [/^build\//, /^package\.json$/, /^README\.md$/, /^LICENSE$/,
                        /^CHANGELOG\.md$/, /^server\.json$/, /^\.github\/SECURITY\.md$/];
            const stray = files.filter(f => !ok.some(re => re.test(f)));
            if (stray.length) {
              console.error("::error::unexpected files in the tarball: " + stray.join(", "));
              process.exit(1);
            }

            // Belt and braces: these must never ship regardless of the allowlist.
            const banned = /(^|\/)(\.env|\.npmrc)$|__tests__|\.test\.|coverage\//;
            const bad = files.filter(f => banned.test(f));
            if (bad.length) {
              console.error("::error::forbidden files in the tarball: " + bad.join(", "));
              process.exit(1);
            }
            console.log("file allowlist: OK");
          '

          # R10 gate on the artifact itself. These are the 1.x strings that reported
          # success for a transaction that was never signed or sent.
          rm -rf /tmp/audit && mkdir -p /tmp/audit
          TARBALL=$(npm pack --silent)
          tar xzf "$TARBALL" -C /tmp/audit
          if grep -rIqE "Trade Execution Signed|execution signed successfully" /tmp/audit/package/build; then
            echo "::error::fabricated-success string present in the packed build — this is the 1.x defect"
            grep -rInE "Trade Execution Signed|execution signed successfully" /tmp/audit/package/build
            exit 1
          fi
          # And the real execution path must actually be in there.
          for sym in simulateTransaction sendRawTransaction confirmTransaction; do
            grep -rIq "$sym" /tmp/audit/package/build/lib/execute.js \
              || { echo "::error::$sym missing from packed execute.js — not the fixed build"; exit 1; }
          done
          echo "fabricated-success grep: OK · sign/send/confirm present: OK"
          rm -f "$TARBALL"

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Only reached if publish succeeded. An automation token authenticates without a
      # one-time password, which is why this belongs in CI — `npm deprecate` from a laptop
      # prompts for an OTP and cannot be scripted.
      - name: Deprecate the defective 1.0.0
        run: |
          npm deprecate bagos-mcp-server@1.0.0 \
            "Defective: write tools reported success without signing. Upgrade to 2.0.0." \
            || echo "::warning::deprecate failed (already deprecated, or token lacks write) — not failing the release"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
