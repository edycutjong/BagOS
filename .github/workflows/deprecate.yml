name: Deprecate an npm version

# Why this exists as a workflow rather than a shell command:
# `npm deprecate` from a laptop prompts for a 2FA one-time password and cannot be
# scripted. The NPM_TOKEN automation token authenticates without one, so CI is the
# only place this runs unattended.
#
# Publishing a new version already deprecates 1.0.0 as its final step (see publish.yml).
# This workflow covers the case where there is nothing to publish — notably right now,
# with 2.0.0 already live and 1.0.0 still undeprecated.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deprecate (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      message:
        description: "Deprecation message shown on install"
        required: true
        default: "Defective: write tools reported success without signing. Upgrade to 2.0.0."

permissions:
  contents: read

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      # Deprecating a version that was never published silently succeeds and looks like
      # it worked, so check first rather than trusting the exit code.
      - name: Confirm the version exists
        run: |
          npm view "bagos-mcp-server@${{ inputs.version }}" version \
            || { echo "::error::bagos-mcp-server@${{ inputs.version }} is not published"; exit 1; }

      - name: Deprecate
        run: npm deprecate "bagos-mcp-server@${{ inputs.version }}" "${{ inputs.message }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify it took
        run: |
          # Poll rather than sleep once. A flat 10s lost the race with npm's
          # registry propagation and reported a failure for a deprecation that
          # had in fact applied — 1.0.0 is deprecated on npm while this step's
          # last run is red. A check that cries wolf is worse than no check.
          for i in $(seq 1 12); do
            D=$(npm view "bagos-mcp-server@${{ inputs.version }}" deprecated 2>/dev/null || true)
            if [ -n "$D" ]; then echo "deprecated: $D"; exit 0; fi
            echo "not visible yet ($i/12), waiting…"; sleep 10
          done
          echo "::error::deprecation did not register within 120s"
          exit 1
