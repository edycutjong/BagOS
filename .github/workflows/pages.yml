name: Pages

# Deploys the product site (site/dist → bagos.edycu.dev) via GitHub Pages.
# The site is static HTML built by a zero-dependency node script, so this
# workflow never runs npm install and cannot be broken by the package's
# dependency tree. Path-filtered: a code-only push does not redeploy the site.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      # build.mjs stamps the version from package.json into the pages. Without this a
      # release bumps the version, the site keeps serving the old one, and the release
      # link and provenance URL point at the previous version indefinitely.
      - 'package.json'
  workflow_dispatch:
# Deliberately NOT triggered on `release: published`, though it used to be. The
# intent was right — a release changes the version and the site must follow it —
# but release-please bumps package.json in the same merge, so the `push` trigger
# above already deploys that exact sha. The release event then fired seconds
# later for the SAME commit and GitHub Pages rejected the duplicate deployment,
# failing on every single release. The site was always live and current; the red
# X was pure noise, and noise on a release workflow is how a real failure gets
# ignored. The package.json path filter is what keeps the version in step.

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time. Unlike CI, in-flight runs are NOT cancelled —
# interrupting a deployment mid-flight can leave Pages serving a broken state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Build ─────────────────────────────────────────────────────
  # Copies site/src into site/dist and stamps CNAME + .nojekyll. The build
  # script exits nonzero if the CNAME is missing or wrong, so a bad deploy
  # fails here rather than silently dropping the custom domain.
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build (zero-dependency copy)
        run: node site/build.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  # ── Deploy ────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
